apply plugin: 'com.android.application'

// Path to the whisper.cpp checkout. Override with whisper.dir=... in local.properties.
def whisperDir() {
    def props = new Properties()
    def f = rootProject.file('local.properties')
    if (f.exists()) f.withInputStream { props.load(it) }
    def d = props.getProperty('whisper.dir') ?: 'C:/Users/770tz/tools/whisper.cpp'
    return d.replace('\\', '/')
}

// ONNX Runtime version (override with -PortVersion=x.y.z for testing).
ext.ORT_VERSION = "1.27.0"  // 1.28+ crash at load under ARM translation (see report)

// App version comes from package.json (single source of truth).
def appVersion() {
    def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
    return pkg.version as String
}
def appVersionCode() {
    def p = appVersion().tokenize('.').collect { it as int }
    return p[0] * 10000 + p[1] * 100 + p[2]
}

// Release signing: android/keystore.properties, or ../petkol-keys/keystore.properties (never committed).
def signingProps() {
    def props = new Properties()
    def candidates = [rootProject.file('keystore.properties'), rootProject.file('../../petkol-keys/keystore.properties')]
    def f = candidates.find { it.exists() }
    if (f) f.withInputStream { props.load(it) }
    return props
}

android {
    namespace = "app.petkol.notes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.petkol.notes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode()
        versionName appVersion()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // arm64-v8a: target devices (Boox), armeabi-v7a: old 32-bit devices, x86_64: emulator only
            // Override with -Pabis=arm64-v8a for a small release APK.
            abiFilters(*((project.findProperty('abis') ?: 'arm64-v8a,armeabi-v7a,x86_64') as String).split(','))
        }
        externalNativeBuild {
            cmake {
                arguments "-DWHISPER_DIR=${whisperDir()}",
                          "-DANDROID_STL=c++_shared",
                          "-DCMAKE_BUILD_TYPE=Release"
                targets "petkol_whisper"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    ndkVersion "27.1.12297006"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    packaging {
        jniLibs {
            // Extract .so files to nativeLibraryDir: ggml loads its CPU backend
            // variant (libggml-cpu-android_*.so) from there with dlopen.
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        release {
            def s = signingProps()
            if (s.getProperty('storeFile')) {
                storeFile file(s.getProperty('storeFile'))
                storePassword s.getProperty('storePassword')
                keyAlias s.getProperty('keyAlias')
                keyPassword s.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Ozen-v1 (ONNX). Native libs are limited to ndk.abiFilters above.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:${project.findProperty('ortVersion') ?: ORT_VERSION}"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
